[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,0
OnRefreshAction=[!CommandMeasure MeasureLua "WriteFile()"]

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
UpdateDivider=5
Substitute="":"N/A"
OnUpdateAction=[!CommandMeasure MeasureLua "WriteFile()"]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
UpdateDivider=5
Substitute="":"N/A"

[MeasureLua]
Measure=Script
ScriptFile=#@#WriteTrack.lua

; Debug meters so you can see values live
[MeterTitleDebug]
Meter=String
MeasureName=MeasureTitle
Text="Title: %1"
FontColor=255,255,255,255
X=10
Y=10
FontSize=12
W=400
ClipString=0

[MeterArtistDebug]
Meter=String
MeasureName=MeasureArtist
Text="Artist: %1"
FontColor=255,255,255,255
X=10
Y=30
FontSize=12
W=400
ClipString=0

[MeterDebug]
Meter=String
Text="Lua not called yet"
FontColor=255,0,0,255
Hidden=1